<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitTrack — Plan, track, level up</title>
  <meta name="description" content="FitTrack: plan workouts, log every set, track progress and level up. Demo by Eoghan Russell.">
  <meta name="theme-color" content="#0f1412">
  <link rel="icon" href="/assets/fitness.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f1412; --panel: #171d1a; --panel-2: #1f2723; --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .16);
      --text: #f2f5f0; --muted: #9aa69f; --dim: #6c7770; --lime: #c6f432; --lime-2: #a6d41a; --lime-soft: rgba(198, 244, 50, .12);
      --blue: #6cc4ff; --orange: #ff9f5a; --red: #ff6b6b; --r: 18px; --shadow: 0 20px 50px -30px rgba(0, 0, 0, .9);
      --head: 'Archivo', system-ui, sans-serif; --sans: 'Inter', system-ui, sans-serif; --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; border-radius: 6px; }
    h1, h2, h3 { font-family: var(--head); letter-spacing: -.02em; margin: 0; }
    .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; padding: 24px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 26px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 38px; height: 38px; border-radius: 11px; background: #fff; padding: 4px; }
    .brand b { font-family: var(--head); font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .brand b span { color: var(--lime); }
    .nav { display: grid; gap: 4px; }
    .nav button { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; color: var(--muted); font-weight: 600; transition: background .2s, color .2s; text-align: left; }
    .nav button i { width: 18px; text-align: center; }
    .nav button:hover { background: var(--panel); color: var(--text); }
    .nav button[aria-current="page"] { background: var(--lime); color: #111; }
    .side-foot { margin-top: auto; font-size: 13px; color: var(--dim); line-height: 1.5; }
    .side-foot a { color: var(--lime); font-weight: 600; text-decoration: none; }
    .main { padding: 26px clamp(16px, 4vw, 40px) 70px; min-width: 0; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .top h1 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 800; }
    .top p { margin: 4px 0 0; color: var(--muted); }
    .top-actions { display: flex; gap: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 14px; transition: background .2s, transform .25s var(--ease), border-color .2s; white-space: nowrap; }
    .btn-lime { background: var(--lime); color: #111; }
    .btn-lime:hover { background: #d4ff4a; transform: translateY(-1px); }
    .btn-dark { background: var(--panel-2); border: 1px solid var(--line); }
    .btn-dark:hover { border-color: var(--line-2); }
    .btn-red { background: rgba(255, 107, 107, .12); color: var(--red); }
    .btn-sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: inline-grid; place-items: center; color: var(--muted); transition: background .2s, color .2s; }
    .icon-btn:hover { background: var(--panel-2); color: var(--text); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
    .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .card h2 small { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
    .grid { display: grid; gap: 16px; }
    .g-3 { grid-template-columns: repeat(3, 1fr); }
    .g-4 { grid-template-columns: repeat(4, 1fr); }
    .g-2 { grid-template-columns: 1.5fr 1fr; }
    .view { animation: fade .45s var(--ease); }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
    /* level card */
    .level { position: relative; overflow: hidden; background: linear-gradient(135deg, #1d2a10 0%, #24331a 50%, #18201b 100%); border-color: rgba(198, 244, 50, .2); }
    .level::after { content: ''; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(198, 244, 50, .25), transparent 70%); }
    .lvl-row { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
    .badge { width: 76px; height: 76px; border-radius: 22px; background: var(--lime); color: #111; display: grid; place-items: center; text-align: center; flex: none; box-shadow: 0 14px 30px -12px rgba(198, 244, 50, .6); }
    .badge small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .badge b { font-family: var(--head); font-size: 32px; line-height: 1; }
    .lvl-row h2 { margin: 0 0 4px; font-size: 22px; }
    .xpbar { height: 10px; border-radius: 10px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 10px; }
    .xpbar i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--lime-2), var(--lime)); transition: width 1.2s var(--ease); }
    .xp-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 600; }
    .stat b { display: block; font-family: var(--head); font-size: 30px; font-weight: 800; line-height: 1.05; }
    .stat span { color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat i { float: right; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--lime-soft); color: var(--lime); }
    .ring-wrap { display: flex; align-items: center; gap: 18px; }
    .ring-label b { display: block; font-family: var(--head); font-size: 28px; font-weight: 800; }
    .ring-label span { color: var(--muted); font-size: 13.5px; }
    .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .quick button { text-align: left; padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); transition: border-color .2s, transform .3s var(--ease); }
    .quick button:hover { border-color: var(--lime); transform: translateY(-2px); }
    .quick b { display: block; font-family: var(--head); font-size: 16px; }
    .quick span { font-size: 12.5px; color: var(--muted); }
    .list-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .list-row:last-child { border-bottom: 0; }
    .list-row .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); color: var(--lime); flex: none; }
    .list-row b { display: block; font-weight: 700; }
    .list-row small { color: var(--muted); }
    .list-row .r { margin-left: auto; text-align: right; font-weight: 700; white-space: nowrap; }
    .list-row .r small { display: block; font-weight: 500; }
    .chart text { fill: var(--dim); font-size: 11px; font-family: var(--sans); }
    .chart .grid-l { stroke: rgba(255, 255, 255, .06); }
    /* workout */
    .session-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin: -26px calc(-1 * clamp(16px, 4vw, 40px)) 20px; background: rgba(15, 20, 18, .9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .session-bar input { background: transparent; border: 0; font-family: var(--head); font-size: 22px; font-weight: 800; width: min(320px, 50vw); padding: 4px 0; }
    .session-bar input:focus { outline: none; border-bottom: 2px solid var(--lime); }
    .timer { font-family: var(--head); font-weight: 700; color: var(--lime); font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
    .session-bar .sp { flex: 1; }
    .ex { margin-bottom: 14px; }
    .ex-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
    .ex-head b { font-family: var(--head); font-size: 18px; }
    .ex-head small { color: var(--muted); font-weight: 600; display: block; font-size: 12.5px; }
    .sets { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    .sets th { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); text-align: center; font-weight: 700; padding: 0 4px; }
    .sets td { text-align: center; padding: 0 4px; }
    .sets tr, .ex .btn { scroll-margin-bottom: 110px; }
    .main.working { padding-bottom: 150px; }
    .sets td:first-child { font-family: var(--head); font-weight: 800; color: var(--muted); width: 38px; }
    .sets .prev { color: var(--dim); font-size: 13px; }
    .sets input { width: 100%; max-width: 90px; height: 40px; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; font-variant-numeric: tabular-nums; }
    .sets input:focus { outline: none; border-color: var(--lime); }
    .sets tr.done input { background: rgba(198, 244, 50, .1); border-color: rgba(198, 244, 50, .3); }
    .tick { width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim); transition: background .2s, color .2s, transform .3s var(--ease); }
    .sets tr.done .tick { background: var(--lime); color: #111; border-color: var(--lime); transform: scale(1.05); }
    .rest { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); z-index: 45; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-radius: 999px; background: var(--lime); color: #111; font-weight: 800; box-shadow: 0 20px 40px -14px rgba(198, 244, 50, .5); transition: transform .45s var(--ease), opacity .3s, visibility .3s; opacity: 0; visibility: hidden; }
    .rest.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
    .rest b { font-family: var(--head); font-size: 20px; font-variant-numeric: tabular-nums; min-width: 54px; }
    .rest button { height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(0, 0, 0, .12); font-weight: 800; font-size: 13px; }
    .add-ex { display: flex; gap: 8px; flex-wrap: wrap; }
    select { height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
    .tpl { display: flex; flex-direction: column; gap: 12px; }
    .tpl ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
    .tpl li { display: flex; justify-content: space-between; gap: 10px; }
    .tpl li b { color: var(--text); font-weight: 600; }
    .tpl .btns { display: flex; gap: 8px; margin-top: auto; }
    .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
    .tag.lime { background: var(--lime-soft); color: var(--lime); }
    details.hist { border-bottom: 1px solid var(--line); }
    details.hist summary { list-style: none; cursor: pointer; }
    details.hist summary::-webkit-details-marker { display: none; }
    details.hist[open] .chev { transform: rotate(180deg); }
    .chev { transition: transform .3s var(--ease); color: var(--dim); }
    .hist-body { padding: 0 0 16px 54px; display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
    .hist-body b { color: var(--text); }
    .month { font-family: var(--head); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 18px 0 4px; }
    .pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .pr { padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
    .pr b { display: block; font-family: var(--head); font-size: 22px; }
    .pr span { font-size: 12.5px; color: var(--muted); }
    .bw-form { display: flex; gap: 8px; }
    .bw-form input { flex: 1; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
    .empty { text-align: center; color: var(--muted); padding: 36px 10px; }
    .empty i { font-size: 30px; color: var(--lime); display: block; margin-bottom: 10px; }
    dialog { border: 0; padding: 0; border-radius: 22px; width: min(480px, calc(100vw - 28px)); background: var(--panel); color: var(--text); box-shadow: 0 40px 100px -30px #000; border: 1px solid var(--line-2); }
    dialog::backdrop { background: rgba(0, 0, 0, .6); backdrop-filter: blur(3px); }
    dialog[open] { animation: pop .35s var(--ease); }
    @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } }
    .m-h { padding: 22px 22px 0; display: flex; justify-content: space-between; align-items: center; }
    .m-h h3 { font-size: 22px; font-weight: 800; }
    .m-b { padding: 16px 22px; display: grid; gap: 12px; }
    .m-f { padding: 0 22px 22px; display: flex; justify-content: flex-end; gap: 8px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .field input, .field select { width: 100%; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
    .field input:focus { outline: none; border-color: var(--lime); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tpl-ex { display: grid; grid-template-columns: 1fr 64px 64px 34px; gap: 6px; align-items: center; }
    .tpl-ex input { height: 38px; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); width: 100%; }
    .summary { text-align: center; padding: 26px 22px 6px; }
    .summary .big { font-size: 48px; }
    .summary h3 { font-size: 26px; margin: 6px 0; }
    .summary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 6px; }
    .summary-stats div { padding: 12px; border-radius: 12px; background: var(--panel-2); }
    .summary-stats b { display: block; font-family: var(--head); font-size: 20px; }
    .summary-stats span { font-size: 12px; color: var(--muted); }
    .levelup { color: var(--lime); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
    .toast { position: fixed; left: 50%; top: 20px; transform: translate(-50%, -30px); opacity: 0; z-index: 60; background: var(--panel-2); border: 1px solid var(--line-2); padding: 12px 18px; border-radius: 999px; font-weight: 600; transition: opacity .3s, transform .4s var(--ease); pointer-events: none; display: flex; gap: 10px; align-items: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast i { color: var(--lime); }
    .tabbar { display: none; }
    @media (max-width: 1100px) { .g-4 { grid-template-columns: repeat(2, 1fr); } .g-2 { grid-template-columns: 1fr; } .g-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .side { display: none; }
      .main { padding: 18px 14px 110px; }
      .session-bar { margin: -18px -14px 16px; }
      .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40; background: rgba(23, 29, 26, .95); border: 1px solid var(--line-2); backdrop-filter: blur(10px); border-radius: 20px; padding: 7px; }
      .tabbar button { display: grid; justify-items: center; gap: 4px; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 700; border-radius: 14px; }
      .tabbar button i { font-size: 17px; }
      .tabbar button[aria-current="page"] { color: #111; background: var(--lime); }
      .rest { bottom: 96px; }
      .g-3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) { .g-4 { grid-template-columns: 1fr 1fr; gap: 10px; } .card { padding: 16px; } .stat b { font-size: 24px; } .sets .prev-col { display: none; } .top-actions .btn span { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="FitTrack navigation">
      <div class="brand"><img src="/assets/fitness.png" alt=""><b>Fit<span>Track</span></b></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">A demo by <a href="/fittrack/">Eoghan Russell</a>.<br>Your workouts stay in this browser.</div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="FitTrack sections"></nav>
  <div class="rest" id="rest" role="timer" aria-live="off"><i class="fas fa-stopwatch" aria-hidden="true"></i><span>Rest</span><b id="restTime">1:30</b><button type="button" data-act="rest-sub">−15</button><button type="button" data-act="rest-add">+15</button><button type="button" data-act="rest-skip">Skip</button></div>
  <dialog id="modal"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
