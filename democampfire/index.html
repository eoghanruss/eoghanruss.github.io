<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmberTales: The Campfire Story Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CORE VARIABLES & RESET
           ========================================= */
        :root {
            --bg-dark: #050505;
            --bg-forest: #0a1014;
            --glass-bg: rgba(20, 25, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #ff8800;
            --accent-dim: #994400;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --font-display: 'Cinzel', serif;
            --font-body: 'Lato', sans-serif;
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           ATMOSPHERIC BACKGROUND & ANIMATIONS
           ========================================= */
        .scene-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Forest Background */
        .bg-forest {
            background: linear-gradient(to bottom, #020205 0%, #0c1218 100%);
            z-index: 0;
        }

        /* Fog */
        .fog {
            background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog1.png') repeat-x;
            background-size: 200% auto;
            opacity: 0.3;
            animation: drift 60s linear infinite;
            z-index: 1;
        }

        @keyframes drift { 0% { background-position: 0 0; } 100% { background-position: -200% 0; } }

        /* Embers */
        .ember-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            overflow: hidden;
        }

        .ember {
            position: absolute;
            bottom: -10px;
            width: 4px; height: 4px;
            background: var(--accent-glow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-glow);
            animation: rise 5s linear infinite;
            opacity: 0;
        }

        @keyframes rise {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-80vh) scale(0); }
        }

        /* Campfire Glow (Bottom Center) */
        .campfire-glow {
            position: absolute;
            bottom: -50px; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 300px;
            background: radial-gradient(ellipse at center, rgba(255, 100, 0, 0.4) 0%, transparent 70%);
            animation: flicker 4s infinite alternate;
            z-index: 2;
            filter: blur(40px);
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            20% { opacity: 0.6; }
            40% { opacity: 0.9; transform: translateX(-50%) scale(1.02); }
            100% { opacity: 0.7; transform: translateX(-50%) scale(0.98); }
        }

        /* =========================================
           UI ARCHITECTURE (GLASSMORPHISM)
           ========================================= */
        #app-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            display: grid;
            grid-template-columns: 1fr;
            transition: all 0.5s ease;
        }

        /* Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            color: var(--accent-glow);
            text-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
            letter-spacing: 2px;
        }

        h2 { font-family: var(--font-display); color: var(--text-main); margin-bottom: 1rem; }
        
        .subtitle { font-size: 0.9rem; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; }

        /* Setup Grid */
        #setup-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            height: 100%;
            overflow-y: auto;
        }

        /* Input Groups */
        .input-group { margin-bottom: 1.5rem; }
        
        label { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-glow); margin-bottom: 0.5rem; }
        
        input, select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font-body);
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(255, 136, 0, 0.2);
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--accent-dim), #662200);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: var(--font-display);
            cursor: pointer;
            transition: transform 0.2s var(--ease-bounce), box-shadow 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 136, 0, 0.4);
        }

        .btn:active { transform: scale(0.95); }

        .btn-secondary { background: rgba(255,255,255,0.1); }
        
        .btn-full { width: 100%; font-size: 1.2rem; padding: 1.5rem; margin-top: 1rem; }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: var(--accent-glow);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* =========================================
           STORY VIEW (HIDDEN INITIALLY)
           ========================================= */
        #story-view {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            flex-direction: column;
            z-index: 20;
        }

        #story-content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            font-size: 1.3rem;
            line-height: 1.8;
            color: #ddd;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            scroll-behavior: smooth;
        }

        .cursor {
            display: inline-block;
            width: 3px; height: 1.2em;
            background: var(--accent-glow);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }

        /* Progress Bar */
        .progress-container { width: 40%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent-glow); transition: width 0.3s; }

        /* Cinematic Mode Classes */
        body.cinematic #app-container { max-width: 100%; width: 100%; height: 100vh; }
        body.cinematic .glass-panel { border-radius: 0; background: rgba(0,0,0,0.4); border: none; }
        body.cinematic .app-header, body.cinematic .controls-bar { opacity: 0; transition: opacity 0.5s; }
        body.cinematic .app-header:hover, body.cinematic .controls-bar:hover { opacity: 1; }

        /* =========================================
           SCARE FX CLASSES
           ========================================= */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-effect { animation: shake 0.5s; }
        
        .flicker-effect { animation: flicker 0.2s 3; }
        
        .flash-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; opacity: 0; pointer-events: none; z-index: 100;
        }
        .flash-active { animation: flash 0.2s ease-out; }
        @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        /* Mobile */
        @media (max-width: 768px) {
            #setup-view { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
            #app-container { height: 95vh; width: 95%; }
        }
    </style>
</head>
<body>

    <div class="scene-layer bg-forest"></div>
    <div class="scene-layer fog"></div>
    <div class="ember-container" id="ember-layer"></div>
    <div class="campfire-glow"></div>
    <div class="flash-overlay" id="flash-overlay"></div>

    <div id="app-container">
        
        <div id="setup-view" class="glass-panel">
            <div class="setup-col">
                <div class="app-header">
                    <h1>EmberTales</h1>
                    <div class="subtitle">The Campfire Story Generator</div>
                </div>

                <div class="input-group">
                    <label>Protagonists</label>
                    <input type="text" id="name1" placeholder="Kid 1 Name">
                </div>
                <div class="input-group">
                    <input type="text" id="name2" placeholder="Kid 2 Name">
                </div>
                <div class="input-group">
                    <input type="text" id="name3" placeholder="Kid 3 (Optional)">
                </div>
                
                <button class="btn btn-secondary" style="width:100%" onclick="randomizeNames()">🎲 Randomize Names</button>

                <div class="input-group" style="margin-top: 1.5rem;">
                    <label>Pronoun Mode (Kid 1)</label>
                    <select id="pronoun-select">
                        <option value="male">Male (He/Him)</option>
                        <option value="female">Female (She/Her)</option>
                        <option value="mixed">Mixed (They/Them)</option>
                    </select>
                </div>
            </div>

            <div class="setup-col">
                <div class="input-group">
                    <label>Scare Level</label>
                    <input type="range" id="scare-slider" min="0" max="2" step="1" value="1">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--text-muted); margin-top:5px;">
                        <span>Mild</span><span>Creepy</span><span>Terrifying</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Typing Speed</label>
                    <input type="range" id="speed-slider" min="10" max="80" value="40">
                </div>

                <div class="input-group">
                    <label>Audio & FX</label>
                    <label style="display:flex; align-items:center; cursor:pointer; color:var(--text-main); font-size:0.9rem;">
                        <input type="checkbox" id="audio-toggle" style="width:auto; margin-right:10px;"> Enable Soundscape
                    </label>
                    <label style="display:flex; align-items:center; cursor:pointer; color:var(--text-main); font-size:0.9rem; margin-top:5px;">
                        <input type="checkbox" id="jump-scare-toggle" checked style="width:auto; margin-right:10px;"> Allow Jump Scares
                    </label>
                </div>

                <div style="flex-grow:1; display:flex; align-items:end;">
                    <button class="btn btn-full" onclick="startStory()">Tell Story</button>
                </div>
            </div>
        </div>

        <div id="story-view" class="glass-panel">
            <div id="story-content-area">
                <span id="story-text"></span><span class="cursor"></span>
            </div>
            
            <div class="controls-bar">
                <div style="display:flex; gap:10px; align-items:center; width:40%;">
                    <button class="btn btn-secondary" style="padding:8px 16px; font-size:0.8rem;" onclick="toggleCinematic()">👁️ Cinematic</button>
                    <button class="btn btn-secondary" style="padding:8px 16px; font-size:0.8rem;" onclick="saveStory()">💾 Save</button>
                    <div style="font-size:0.8rem; color:var(--text-muted); margin-left:10px;">Words: <span id="word-count">0</span></div>
                </div>
                
                <div class="progress-container">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>

                <button class="btn btn-secondary" style="padding:8px 16px; font-size:0.8rem;" onclick="resetApp()">❌ Restart</button>
            </div>
        </div>

    </div>

    <script>
        /* =========================================================
        DATA: NAME BANKS & CONFIGURATION
        =========================================================
        */
        const maleNames = ["Liam", "Noah", "Oliver", "Elijah", "Lucas", "Mason", "Ethan", "James", "Aiden", "Carter", "Logan", "Alexander", "Caleb", "Ryan", "Jack", "Finn", "Julian", "Gabriel", "Leo", "Ezra"];
        const femaleNames = ["Olivia", "Emma", "Ava", "Sophia", "Isabella", "Mia", "Charlotte", "Amelia", "Harper", "Evelyn", "Abigail", "Emily", "Ella", "Scarlett", "Grace", "Chloe", "Lily", "Riley", "Zoey", "Nora"];

        const pronouns = {
            male: { subject: "he", object: "him", possessive: "his", Subject: "He", Object: "Him", Possessive: "His" },
            female: { subject: "she", object: "her", possessive: "her", Subject: "She", Object: "Her", Possessive: "Her" },
            mixed: { subject: "they", object: "them", possessive: "their", Subject: "They", Object: "Them", Possessive: "Their" }
        };

        /* =========================================================
        INSERT FULL CAMPFIRE STORIES HERE
        Each story should be between 800–1200 words.

        Use the following placeholder tokens:
        
        {NAME1} - Main Protagonist
        {NAME2} - Secondary Character
        {NAME3} - Tertiary Character (if empty, code handles logic)
        {PRONOUN_SUBJECT} - he/she/they
        {PRONOUN_OBJECT} - him/her/them
        {PRONOUN_POSSESSIVE} - his/her/their
        
        Example:
        "{NAME1} thought {PRONOUN_SUBJECT} heard something behind the trees."

        Do NOT remove the token format.
        Keep each story inside backticks.
        =========================================================
        */
/* =========================================================
   INSERT FULL CAMPFIRE STORIES HERE
   ========================================================= */
const stories = [
    // STORY 1: THE WHISPERING LAKE
    {
        title: "The Whispering Lake",
        content: `The fire crackled, casting long, dancing shadows against the heavy pine trees. {NAME1} pulled {PRONOUN_POSSESSIVE} jacket tighter, staring into the flames. The air around the lake had dropped twenty degrees since the sun went down, and a thick, unnatural fog was beginning to curl over the water's edge.

"Did you hear that?" {NAME1} whispered, {PRONOUN_POSSESSIVE} voice trembling slightly.

{NAME2} rolled their eyes, poking the fire with a stick. "Hear what? The wind? Stop trying to scare us, {NAME1}. We're miles from the nearest town."

"It wasn't the wind," {NAME1} insisted. {PRONOUN_SUBJECT} stood up slowly, dusting ash from {PRONOUN_POSSESSIVE} jeans. "It sounded like... wet footsteps. Slapping against the dock."

{NAME3}, who had been dozing in a folding chair, stirred. "Go check it out then. Prove it's nothing so I can go back to sleep."

{NAME1} hesitated. The darkness beyond the firelight felt heavy, like a physical weight pressing against {PRONOUN_POSSESSIVE} chest. But pride won out. {PRONOUN_SUBJECT} grabbed a heavy flashlight and walked toward the lake.

The beam of light cut through the fog, illuminating swirling dust motes but little else. The old wooden dock creaked under {NAME1}'s boots. The water was perfectly still—like black glass. Too still. There were no ripples, despite the breeze.

{NAME1} walked to the end of the dock and shone the light down.

Reflected in the black water was {NAME1}'s own face. Pale, wide-eyed, terrified. {NAME1} let out a breath {PRONOUN_SUBJECT} didn't know {PRONOUN_SUBJECT} was holding. "Just me," {PRONOUN_SUBJECT} muttered.

Then, the reflection smiled.

{NAME1} wasn't smiling.

{NAME1} stumbled back, heart hammering against {PRONOUN_POSSESSIVE} ribs. "Guys!" {PRONOUN_SUBJECT} screamed, spinning around to run back to the fire.

But the fire was gone.

The campsite was gone. There was no tent. No {NAME2}. No {NAME3}. Just endless, towering pines and the fog.

"Guys?" {NAME1} whispered.

From the water behind {PRONOUN_OBJECT}, a sound emerged. *Drip. Drip. Drip.*

{NAME1} turned slowly. Standing on the edge of the dock was a figure. It looked exactly like {NAME2}, but its skin was gray and bloated, water pouring from its clothes. It opened its mouth, and lake water spilled out.

"It's so cold down here, {NAME1}," the thing that looked like {NAME2} gurgled. "The water... it whispers to us."

{NAME1} backed away, hitting the tree line. "You're not real."

"We are all real," a voice said from the left. {NAME1} jerked the flashlight. {NAME3} was standing there, leaning against a tree. But {NAME3}'s eyes were missing, replaced by hollow pits filled with dripping lake mud.

"{NAME1}..." the thing wearing {NAME3}'s face moaned. "{NAME1}, come swim."

{NAME1} turned and ran. {PRONOUN_SUBJECT} ran until {PRONOUN_POSSESSIVE} lungs burned and {PRONOUN_POSSESSIVE} legs gave out. {PRONOUN_SUBJECT} saw the orange glow of a fire ahead and sobbed with relief, bursting into the clearing.

"{NAME2}! {NAME3}!" {NAME1} cried out, falling to {PRONOUN_POSSESSIVE} knees near the warmth.

{NAME2} and {NAME3} looked up from the fire, startled. They looked normal. Alive. dry.

"Whoa, {NAME1}, you okay?" {NAME2} asked, standing up. "You were only gone for ten seconds."

{NAME1} gasped for air, gripping {NAME2}'s arm. "The lake. You were... dead. The reflection..."

{NAME3} laughed nervously. "You look like you've seen a ghost. Sit down. You're freezing. You're soaking wet."

{NAME1} looked down at {PRONOUN_POSSESSIVE} clothes. They were bone dry. "I'm not..."

"Here," {NAME2} said, handing {NAME1} a bottle of water. "Drink."

{NAME1} took the bottle. The plastic felt cold. {PRONOUN_SUBJECT} looked at {NAME2}'s hand. There, between the fingers, was a single strand of green pond weed.

{NAME1} looked up at {NAME2}'s face. The firelight flickered. For a split second, {NAME2}'s eyes went black, and water trickled from {PRONOUN_POSSESSIVE} ear.

"Drink up," {NAME2} whispered. "The lake is waiting."`
    },

    // STORY 2: CABIN 13
    {
        title: "Cabin 13",
        content: `The GPS said they had arrived, but the cabin didn't look like the pictures online. It was taller, narrower, and the wood was stained a color that reminded {NAME1} of dried bruises.

"I thought you said this place was cozy," {NAME3} muttered, grabbing a bag from the trunk. "This looks like the house where fairytales go to die."

"It was the only one available," {NAME1} snapped, though {PRONOUN_SUBJECT} felt a knot of unease tightening in {PRONOUN_POSSESSIVE} stomach. "{NAME2}, grab the cooler."

They unlocked the front door with the code the host had emailed. Inside, it smelled of stale lavender and old dust. The layout was strange—too many hallways for a house this size.

By midnight, the storm had rolled in. Thunder shook the floorboards, and the power flickered before dying completely.

"Great," {NAME2} groaned from the darkness of the living room. "Who has the flashlights?"

{NAME1} fumbled in {PRONOUN_POSSESSIVE} bag. "I've got one." {PRONOUN_SUBJECT} clicked it on. The beam cut through the dusty air.

"Where's {NAME3}?" {NAME1} asked.

"Went to the bathroom five minutes ago," {NAME2} replied.

{NAME1} shone the light down the hallway. " {NAME3}?"

Silence.

{NAME1} and {NAME2} walked down the hall. The bathroom door was open. Empty.

"Maybe they went upstairs?" {NAME2} suggested, though {PRONOUN_POSSESSIVE} voice wavered.

They climbed the stairs. The wood groaned under {NAME1}'s feet, sounding almost like a voice saying *leave*. At the top of the stairs, there were three doors.

"That's weird," {NAME1} whispered. "From the outside, this place only looked big enough for two bedrooms."

They opened the first door. A normal bedroom.
They opened the second door. A closet.

They stood before the third door. It was painted black, with the number '13' scratched into the wood, seemingly with a fingernail.

"{NAME1}, I don't like this," {NAME2} whispered, gripping {NAME1}'s shoulder. "Let's just go find {NAME3} and leave."

"We have to check," {NAME1} said, though {PRONOUN_SUBJECT} didn't want to. {PRONOUN_SUBJECT} reached out and turned the knob. It was ice cold.

The door creaked open.

The room inside was impossible. It was massive—the size of a gymnasium—with a ceiling that stretched up into darkness. The floor was covered in dirt. In the center of the dirt floor sat a single wooden chair.

Sitting in the chair was {NAME3}.

"{NAME3}!" {NAME1} shouted, running forward.

{NAME3} didn't move. {NAME1} grabbed {NAME3}'s shoulder and spun them around.

It was a mannequin. A wooden mannequin wearing {NAME3}'s clothes.

"What the..." {NAME2} backed away toward the door. "We're leaving. Now."

They turned to run, but the door was gone. Just smooth, uninterrupted wall.

Then, a sound came from above. Scuttling. Like a thousand insects moving on dry leaves.

{NAME1} slowly pointed the flashlight up into the high, dark ceiling.

Far above, clinging to the corners like a spider, was {NAME3}. But {NAME3}'s limbs were elongated, broken and twisted at impossible angles to grip the walls. {NAME3}'s head rotated 180 degrees to look down at them.

"It fits," {NAME3}'s voice croaked, echoing from the ceiling. "The wood... it fits my skin."

The thing that used to be {NAME3} let go of the ceiling.

{NAME1} screamed as the flashlight fell, rolling across the dirt floor. The light spun, casting wild shadows. The last thing {NAME1} saw was {NAME2} being dragged into the darkness, and a wooden hand reaching out for {PRONOUN_OBJECT}.`
    },

    // STORY 3: THE MIDNIGHT HIKER
    {
        title: "The Midnight Hiker",
        content: `"We're lost, aren't we?" {NAME3} asked, leaning against a large oak tree, breathing heavily.

"We are not lost," {NAME1} lied. {PRONOUN_SUBJECT} adjusted the strap of {PRONOUN_POSSESSIVE} backpack. "The trail marker said 2 miles. We've just been walking slow."

"We've been walking for four hours, {NAME1}," {NAME2} pointed out, shining a flashlight at their watch. "It's 2:00 AM. We should have been back at the car by ten."

{NAME1} looked around. The woods felt hostile at night. The trees seemed to lean in, listening. The path ahead was narrow, winding down into a valley that shouldn't be there.

"Look," {NAME1} said, pointing to a blue blaze painted on a tree trunk. "Blue markers. We're still on the trail."

"We passed that tree already," {NAME3} whispered.

"Don't be stupid. All trees look the same at night."

"No," {NAME3} insisted, voice rising in panic. "I carved my initial in the mud right there. Look."

{NAME1} shone the light at the base of the tree. There, in the wet earth, was a crude 'K'.

A cold chill ran down {NAME1}'s spine. They were walking in circles.

"Okay," {NAME1} said, trying to keep {PRONOUN_POSSESSIVE} voice steady. "We must have missed a turn. Let's just keep going straight. No turns."

They walked for another twenty minutes in silence. The only sound was the crunch of dry leaves under their boots.

*Crunch. Crunch.*

Then—

*Crunch. Crunch. Crunch.*

{NAME1} stopped. "Stop."

The others froze.
