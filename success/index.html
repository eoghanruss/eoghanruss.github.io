<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message sent | Eoghan Russell</title>
  <meta name="description" content="Thanks for reaching out. I’ve received your message and will get back to you as soon as possible.">
  <meta name="theme-color" content="#f4efe5">
  <meta property="og:title" content="Message sent | Eoghan Russell">
  <meta property="og:description" content="Thanks for reaching out. I’ve received your message and will get back to you as soon as possible.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/classic.css">
  <script>(function(){var r=document.documentElement;try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=t;if(sessionStorage.getItem('curtain')==='1'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){r.classList.add('arriving')}sessionStorage.removeItem('curtain')}catch(e){r.dataset.theme='light'}})();</script>
</head>
<body>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>
  <main class="lost">
    <div>
      <i class="fas fa-circle-check reveal" aria-hidden="true" style="font-size:2.6rem;color:var(--accent-2)"></i>
      <h1 class="reveal" style="--d:.05s;margin-top:18px"><span style="font-size:.55em">Message <span class="text-gradient">sent!</span></span></h1>
      <p class="reveal" style="--d:.1s">Thanks for reaching out. I’ve received your message and will get back to you as soon as possible.</p>
      <a href="/" class="btn btn-primary reveal" style="--d:.15s">Back to the site <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </div>
  </main>
  <script src="/js/classic.js" defer></script>
  <script src="/js/enhance.js" defer></script>
</body>
</html>
