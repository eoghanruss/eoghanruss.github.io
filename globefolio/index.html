<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Tracker Project - 3D Experience</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-weight=%22bold%22 fill=%22%2338bdf8%22>E</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-color: #0a0f18; /* Deep dark blue/black */
            --text-main: #f0f2f5;
            --text-muted: #94a3b8;
            --accent-main: #38bdf8; 
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --nav-height: 80px;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-main: #0284c7; 
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden; 
            user-select: none;
            transition: background-color 0.5s ease;
        }

        /* --- 3D CANVAS (Pushed to back) --- */
        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; 
            display: block;
            pointer-events: auto;
        }

        /* --- UI OVERLAYS (Pushed to front) --- */
        .cursor-dot {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
            width: 12px; height: 12px; background-color: var(--accent-main);
            box-shadow: 0 0 15px var(--accent-main); transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        body.hovering .cursor-dot { width: 30px; height: 30px; background-color: transparent; border: 2px solid var(--accent-main); }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            z-index: 100; display: flex; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;}
        .logo { font-size: 1.5rem; font-weight: 700; font-family: var(--font-head); color: var(--text-main); text-decoration: none;}
        .nav-links { display: flex; gap: 30px; align-items: center; list-style: none; }
        .nav-link { font-weight: 500; font-size: 0.95rem; color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-link:hover { color: var(--accent-main); }
        .theme-toggle {
            padding: 10px; border-radius: 50%; background: transparent; border: 1px solid var(--glass-border);
            color: var(--text-main); transition: 0.3s; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
        }

        /* --- CONTROLS --- */
        #ui-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50;
        }

        #shape-controls {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 10px; border-radius: 50px;
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            pointer-events: auto; transition: opacity 0.4s ease;
        }
        .shape-btn {
            background: transparent; border: none; color: var(--text-muted); font-family: var(--font-body);
            font-size: 0.9rem; padding: 8px 20px; border-radius: 30px; transition: 0.3s; pointer-events: auto;
        }
        .shape-btn.active, .shape-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }

        #action-overlay {
            position: absolute; top: 50%; right: 5%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #action-overlay.active { opacity: 1; pointer-events: auto; }
        .action-btn {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            color: var(--text-main); width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem; transition: 0.3s;
        }
        .action-btn:hover { background: var(--accent-main); color: #fff; transform: scale(1.1); }

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body data-theme="dark">

    <div class="cursor-dot" data-cursor-dot></div>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">EOGHAN<span style="color:var(--accent-main)">.</span></a>
            <ul class="nav-links">
                <li><a href="#" class="nav-link">Work</a></li>
                <li><a href="#" class="nav-link">Journey</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
            <div class="theme-toggle" id="theme-btn"><i class="fas fa-sun"></i></div>
        </div>
    </nav>

    <div id="ui-wrapper">
        <div id="shape-controls">
            <button class="shape-btn active" data-shape="sphere">Sphere</button>
            <button class="shape-btn" data-shape="helix">Helix</button>
            <button class="shape-btn" data-shape="grid">Grid</button>
        </div>

        <div id="action-overlay">
            <button class="action-btn" id="flip-btn" title="Flip Card"><i class="fas fa-sync-alt"></i></button>
            <button class="action-btn" id="close-btn" title="Close"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <canvas id="webgl-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CORE CONFIG ---
        const config = {
            numItems: 36,
            globeRadius: 14,
            itemWidth: 2.8,
            itemHeight: 4.0,
            radius: 0.15,
            hoverScale: 1.1,
            colors: {
                dark: { bg: 0x0a0f18, fog: 0x0a0f18, ambient: 2.0 },
                light: { bg: 0xf8fafc, fog: 0xf8fafc, ambient: 3.0 }
            }
        };

        let scene, camera, renderer, composer;
        let galleryGroup = new THREE.Group();
        let particleSystem;
        let items = [];
        
        // INTERACTION STATE
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredItem = null;
        let activeItem = null;
        let currentShape = 'sphere';
        let isFlipped = false;

        // PHYSICS STATE
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };
        let scrollTargetZ = 35;

        init();
        animate();

        function init() {
            const canvas = document.getElementById('webgl-canvas');
            
            // 1. SCENE SETUP
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(config.colors.dark.fog, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = scrollTargetZ;

            // 2. RENDERER (Optimized)
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap at 2 to prevent extreme lag on Retina
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0; 

            // 3. POST-PROCESSING (Bloom only, no Bokeh)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.5; 
            bloomPass.strength = 0.3; 
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 4. LIGHTING
            const ambientLight = new THREE.AmbientLight(0xffffff, config.colors.dark.ambient);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 20);
            scene.add(dirLight);

            // 5. BUILD ENVIRONMENT
            createParticles();
            scene.add(galleryGroup);
            createGalleryItems();

            calculateSphereLayout();
            calculateHelixLayout();
            calculateGridLayout();
            
            transitionToShape('sphere');

            // 6. EVENTS
            bindEvents();
            setupThemeToggle();
        }

        // --- GEOMETRY & TEXTURES ---
        function createRoundedRect(w, h, r) {
            const shape = new THREE.Shape();
            const x = -w/2, y = -h/2;
            shape.moveTo(x, y + r); shape.lineTo(x, y + h - r); shape.quadraticCurveTo(x, y + h, x + r, y + h);
            shape.lineTo(x + w - r, y + h); shape.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
            shape.lineTo(x + w, y + r); shape.quadraticCurveTo(x + w, y, x + w - r, y);
            shape.lineTo(x + r, y); shape.quadraticCurveTo(x, y, x, y + r);
            const geo = new THREE.ShapeGeometry(shape);
            
            // Fix UV mapping for correct image display
            const pos = geo.attributes.position;
            const uvs = new Float32Array(pos.count * 2);
            for (let i = 0; i < pos.count; i++) { 
                uvs[i*2] = (pos.getX(i)/w)+0.5; 
                uvs[i*2+1] = (pos.getY(i)/h)+0.5; 
            }
            geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            return geo;
        }

        function createBacksideTexture(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 768;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#161920'; 
            ctx.fillRect(0,0,512,768);
            
            ctx.fillStyle = '#38bdf8'; 
            ctx.font = 'bold 40px Arial';
            ctx.fillText(`Project ${index + 1}`, 50, 100);
            
            ctx.fillStyle = '#94a3b8'; 
            ctx.font = '24px Arial';
            ctx.fillText('Role: Full Stack Developer', 50, 160);
            ctx.fillText('Tech: Three.js, Node, GSAP', 50, 200);
            
            ctx.fillStyle = '#f0f2f5'; 
            ctx.font = '20px Arial';
            ctx.fillText('Optimized high-performance', 50, 280);
            ctx.fillText('WebGL rendering pipeline.', 50, 310);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createGalleryItems() {
            const texLoader = new THREE.TextureLoader();
            const geo = createRoundedRect(config.itemWidth, config.itemHeight, config.radius);

            for (let i = 0; i < config.numItems; i++) {
                const group = new THREE.Group(); 

                // Load static images to prevent CORS crashes
                const frontTex = texLoader.load(`https://picsum.photos/seed/${i * 42}/400/600`);
                frontTex.colorSpace = THREE.SRGBColorSpace;

                // MeshPhysicalMaterial gives us a nice clearcoat glass reflection
                const frontMat = new THREE.MeshPhysicalMaterial({
                    map: frontTex, roughness: 0.2, metalness: 0.1,
                    clearcoat: 0.8, clearcoatRoughness: 0.2, side: THREE.FrontSide
                });
                const frontMesh = new THREE.Mesh(geo, frontMat);
                
                // Back mesh uses basic material to save performance
                const backMat = new THREE.MeshBasicMaterial({ map: createBacksideTexture(i), side: THREE.FrontSide });
                const backMesh = new THREE.Mesh(geo, backMat);
                backMesh.rotation.y = Math.PI; 

                group.add(frontMesh);
                group.add(backMesh);
                
                // Invisible Hitbox for easier raycasting
                const hitBox = new THREE.Mesh(new THREE.BoxGeometry(config.itemWidth, config.itemHeight, 0.2), new THREE.MeshBasicMaterial({visible:false}));
                group.add(hitBox);

                group.userData = { id: i, layouts: { sphere: {}, helix: {}, grid: {} } };

                galleryGroup.add(group);
                items.push(group);
            }
        }

        // --- LAYOUT CALCULATIONS ---
        function calculateSphereLayout() {
            const phi = Math.PI * (3 - Math.sqrt(5)); 
            items.forEach((item, i) => {
                const y = 1 - (i / (config.numItems - 1)) * 2; 
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = phi * i;
                const pos = new THREE.Vector3(Math.cos(theta) * radiusAtY, y, Math.sin(theta) * radiusAtY).multiplyScalar(config.globeRadius);
                
                const dummy = new THREE.Object3D();
                dummy.position.copy(pos);
                dummy.lookAt(pos.clone().multiplyScalar(2));
                
                item.userData.layouts.sphere = { position: pos, quaternion: dummy.quaternion.clone() };
            });
        }

        function calculateHelixLayout() {
            items.forEach((item, i) => {
                const y = - (config.numItems / 2) * 0.5 + (i * 0.5);
                const theta = i * 0.6;
                const pos = new THREE.Vector3(Math.cos(theta) * 10, y, Math.sin(theta) * 10);
                
                const dummy = new THREE.Object3D();
                dummy.position.copy(pos);
                dummy.lookAt(new THREE.Vector3(0, y, 0)); 
                dummy.rotation.y += Math.PI; 

                item.userData.layouts.helix = { position: pos, quaternion: dummy.quaternion.clone() };
            });
        }

        function calculateGridLayout() {
            const cols = 6;
            const spacingX = config.itemWidth * 1.3;
            const spacingY = config.itemHeight * 1.3;
            items.forEach((item, i) => {
                const row = Math.floor(i / cols);
                const col = i % cols;
                const pos = new THREE.Vector3(
                    (col - cols/2 + 0.5) * spacingX,
                    -(row - (config.numItems/cols)/2 + 0.5) * spacingY,
                    0
                );
                
                const dummy = new THREE.Object3D(); 
                item.userData.layouts.grid = { position: pos, quaternion: dummy.quaternion.clone() };
            });
        }

        function transitionToShape(shapeName) {
            currentShape = shapeName;
            items.forEach((item, index) => {
                if(item === activeItem) return; 
                const target = item.userData.layouts[shapeName];
                gsap.to(item.position, { x: target.position.x, y: target.position.y, z: target.position.z, duration: 1.5, ease: "power3.inOut", delay: index * 0.01 });
                gsap.to(item.quaternion, { x: target.quaternion.x, y: target.quaternion.y, z: target.quaternion.z, w: target.quaternion.w, duration: 1.5, ease: "power3.inOut", delay: index * 0.01 });
            });
            
            if(shapeName === 'grid') gsap.to(targetRotation, {x:0, y:0, duration: 1.5});
        }

        // --- PARTICLES (Optimized) ---
        function createParticles() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(1500 * 3); // Reduced count for performance
            for(let i=0; i<4500; i++) pos[i] = (Math.random() - 0.5) * 80;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.1, transparent: true, opacity: 0.3 });
            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
        }

        // --- EVENTS & INTERACTIONS ---
        function bindEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
            });
            
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', () => { isDragging = true; previousMouse = {x: event.clientX, y: event.clientY}; });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('click', onClick);
            
            window.addEventListener('wheel', (e) => {
                if(activeItem) return;
                scrollTargetZ += e.deltaY * 0.05;
                scrollTargetZ = Math.max(15, Math.min(scrollTargetZ, 60)); 
            });

            // UI Buttons
            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    transitionToShape(e.target.dataset.shape);
                });
            });

            document.getElementById('close-btn').addEventListener('click', closeExpandedView);
            document.getElementById('flip-btn').addEventListener('click', flipCard);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const dot = document.querySelector('[data-cursor-dot]');
            dot.style.left = `${event.clientX}px`; dot.style.top = `${event.clientY}px`;

            if (isDragging && !activeItem && currentShape !== 'grid') {
                targetRotation.y += (event.clientX - previousMouse.x) * 0.005;
                targetRotation.x += (event.clientY - previousMouse.y) * 0.005;
                targetRotation.x = Math.max(-0.5, Math.min(0.5, targetRotation.x));
                previousMouse = { x: event.clientX, y: event.clientY };
            }

            handleHover();
        }

        function handleHover() {
            if (activeItem) return; 

            raycaster.setFromCamera(mouse, camera);
            const hits = items.map(g => g.children[2]); // Raycast against the invisible hitboxes
            const intersects = raycaster.intersectObjects(hits);

            if (intersects.length > 0) {
                const group = intersects[0].object.parent;
                document.body.classList.add('hovering');

                if (hoveredItem !== group) {
                    if (hoveredItem) resetHover(hoveredItem);
                    hoveredItem = group;
                    gsap.to(hoveredItem.scale, { x: config.hoverScale, y: config.hoverScale, z: config.hoverScale, duration: 0.3 });
                }
            } else {
                document.body.classList.remove('hovering');
                if (hoveredItem) { resetHover(hoveredItem); hoveredItem = null; }
            }
        }

        function resetHover(group) {
            gsap.to(group.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
        }

        function onClick() {
            if (activeItem || !hoveredItem) return;

            activeItem = hoveredItem;
            document.body.classList.remove('hovering');

            // UI Transitions
            document.getElementById('shape-controls').style.opacity = '0';
            document.getElementById('shape-controls').style.pointerEvents = 'none';
            document.getElementById('action-overlay').classList.add('active');

            // Fade out background items safely
            items.forEach(p => { 
                if (p !== activeItem) {
                    gsap.to(p.children[0].material, { opacity: 0.1, transparent: true, duration: 0.5 }); 
                    gsap.to(p.children[1].material, { opacity: 0.1, transparent: true, duration: 0.5 }); 
                }
            });
            
            // Calculate Position strictly in front of camera
            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
            const dist = Math.abs((config.itemHeight * 1.5) / (2 * Math.tan(camera.fov * Math.PI / 360)));
            const targetPos = new THREE.Vector3().copy(camera.position).add(camDir.multiplyScalar(dist));

            scene.attach(activeItem); 
            gsap.to(activeItem.position, { x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.2, ease: "power3.inOut" });
            gsap.to(activeItem.quaternion, { x: camera.quaternion.x, y: camera.quaternion.y, z: camera.quaternion.z, w: camera.quaternion.w, duration: 1.2, ease: "power3.inOut" });
            gsap.to(activeItem.scale, { x: 2, y: 2, z: 2, duration: 1.2, ease: "power3.inOut" });
        }

        function flipCard() {
            if(!activeItem) return;
            isFlipped = !isFlipped;
            gsap.to(activeItem.rotation, { y: activeItem.rotation.y + Math.PI, duration: 0.8, ease: "back.out(1.2)" });
        }

        function closeExpandedView() {
            if (!activeItem) return;

            // UI Transitions
            document.getElementById('shape-controls').style.opacity = '1';
            document.getElementById('shape-controls').style.pointerEvents = 'auto';
            document.getElementById('action-overlay').classList.remove('active');

            if(isFlipped) { isFlipped = false; activeItem.rotation.y -= Math.PI; }

            const targetData = activeItem.userData.layouts[currentShape];
            
            // Calculate global return position
            const dummy = new THREE.Object3D();
            dummy.position.copy(targetData.position);
            dummy.quaternion.copy(targetData.quaternion);
            galleryGroup.add(dummy);
            
            const targetWorldPos = new THREE.Vector3(); const targetWorldQuat = new THREE.Quaternion();
            dummy.getWorldPosition(targetWorldPos); dummy.getWorldQuaternion(targetWorldQuat);
            galleryGroup.remove(dummy);

            gsap.to(activeItem.position, { x: targetWorldPos.x, y: targetWorldPos.y, z: targetWorldPos.z, duration: 1, ease: "power3.inOut" });
            gsap.to(activeItem.quaternion, { x: targetWorldQuat.x, y: targetWorldQuat.y, z: targetWorldQuat.z, w: targetWorldQuat.w, duration: 1, ease: "power3.inOut" });
            gsap.to(activeItem.scale, { x: 1, y: 1, z: 1, duration: 1, ease: "power3.inOut", onComplete: () => {
                galleryGroup.attach(activeItem); 
                activeItem = null;
                
                // Restore Opacity
                items.forEach(p => {
                    gsap.to(p.children[0].material, { opacity: 1, duration: 0.5 });
                    gsap.to(p.children[1].material, { opacity: 1, duration: 0.5 });
                });
            }});
        }

        function setupThemeToggle() {
            const btn = document.getElementById('theme-btn');
            btn.addEventListener('click', () => {
                const body = document.body;
                const isLight = body.getAttribute('data-theme') === 'light';
                const nextTheme = isLight ? 'dark' : 'light';
                
                body.setAttribute('data-theme', nextTheme);
                btn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                
                const conf = config.colors[nextTheme];
                gsap.to(scene.background, { r: new THREE.Color(conf.bg).r, g: new THREE.Color(conf.bg).g, b: new THREE.Color(conf.bg).b, duration: 1 });
                gsap.to(scene.fog.color, { r: new THREE.Color(conf.fog).r, g: new THREE.Color(conf.fog).g, b: new THREE.Color(conf.fog).b, duration: 1 });
                gsap.to(scene.children[0], { intensity: conf.ambient, duration: 1 }); // Ambient Light
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            if (!isDragging && !activeItem && currentShape === 'sphere') targetRotation.y += 0.0015; 

            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;

            galleryGroup.rotation.x = currentRotation.x;
            galleryGroup.rotation.y = currentRotation.y;
            
            if (!activeItem) galleryGroup.position.y = Math.sin(time * 0.5) * 0.3; 

            camera.position.z += (scrollTargetZ - camera.position.z) * 0.05;

            // Highly optimized particle rotation (No expensive math per frame)
            particleSystem.rotation.y = time * 0.02;

            composer.render(); 
        }
    </script>
</body>
</html>
