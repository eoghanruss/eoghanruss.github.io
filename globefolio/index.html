<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Tracker Project - 3D Experience</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-weight=%22bold%22 fill=%22%2338bdf8%22>E</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           1. SHARED THEME & VARIABLES
           ========================================= */
        :root {
            --bg-color: #0f1115;
            --bg-secondary: #161920;
            --text-main: #f0f2f5;
            --text-muted: #94a3b8;
            --accent-main: #38bdf8; 
            --accent-glow: rgba(56, 189, 248, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --nav-height: 80px;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --bg-secondary: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-main: #0284c7; 
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden; /* Lock native scroll for 3D experience */
            transition: background-color 0.4s ease, color 0.4s ease;
            user-select: none;
        }

        /* --- 3D Canvas Integration --- */
        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            display: block;
        }

        /* --- UI Elements --- */
        .cursor-dot {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
            width: 10px; height: 10px; background-color: var(--accent-main);
            box-shadow: 0 0 10px var(--accent-main); transition: width 0.2s, height 0.2s;
        }
        body.hovering .cursor-dot { width: 25px; height: 25px; opacity: 0.5; background: transparent; border: 2px solid var(--accent-main); }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            z-index: 1000; transition: 0.4s; display: flex; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;}
        .logo { font-size: 1.5rem; font-weight: 700; font-family: var(--font-head); color: var(--text-main); text-decoration: none;}
        .nav-links { display: flex; gap: 30px; align-items: center; list-style: none; }
        .nav-link { font-weight: 500; font-size: 0.95rem; color: var(--text-muted); text-decoration: none; transition: 0.3s; }
        .nav-link:hover { color: var(--accent-main); }
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .theme-toggle {
            padding: 10px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-main); transition: 0.3s;
        }

        footer {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px 0;
            text-align: center; z-index: 1000; pointer-events: none;
            background: linear-gradient(to top, var(--bg-color), transparent);
        }

        /* --- New 3D Controls UI --- */
        #shape-controls {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; gap: 15px;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 50px; border: 1px solid var(--glass-border);
        }
        .shape-btn {
            background: transparent; border: none; color: var(--text-muted); font-family: var(--font-body);
            font-size: 0.9rem; padding: 5px 15px; border-radius: 30px; transition: 0.3s; pointer-events: auto;
        }
        .shape-btn.active, .shape-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }

        #action-overlay {
            position: fixed; top: 50%; right: 5%; transform: translateY(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 15px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        #action-overlay.active { pointer-events: auto; opacity: 1; }
        .action-btn {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            color: var(--text-main); width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem; transition: 0.3s;
        }
        .action-btn:hover { background: var(--accent-main); color: #fff; transform: scale(1.1); }
        
        /* Video hidden element */
        #hidden-video { display: none; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body data-theme="dark">

    <div class="cursor-dot" data-cursor-dot></div>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">EOGHAN<span style="color:var(--accent-main)">.</span></a>
            <ul class="nav-links">
                <li><a href="#" class="nav-link">Work</a></li>
                <li><a href="#" class="nav-link">Journey</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <div class="theme-toggle" id="theme-btn"><i class="fas fa-sun"></i></div>
            </div>
        </div>
    </nav>

    <div id="shape-controls">
        <button class="shape-btn active" data-shape="sphere">Sphere</button>
        <button class="shape-btn" data-shape="helix">Helix</button>
        <button class="shape-btn" data-shape="grid">Grid</button>
    </div>

    <div id="action-overlay">
        <button class="action-btn" id="flip-btn" title="Flip Card"><i class="fas fa-sync-alt"></i></button>
        <button class="action-btn" id="close-btn" title="Close"><i class="fas fa-times"></i></button>
    </div>

    <video id="hidden-video" loop crossOrigin="anonymous" playsinline>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>

    <canvas id="webgl-canvas"></canvas>

    <footer>
        <p style="color:var(--text-muted); font-size: 0.9rem;">&copy; 2026 Eoghan Russell. Scroll to zoom. Drag to explore.</p>
    </footer>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

        // --- Core Configurations ---
        const config = {
            numItems: 36,
            globeRadius: 14,
            itemWidth: 2.8,
            itemHeight: 4.0,
            radius: 0.15,
            hoverScale: 1.08,
            colors: {
                dark: { bg: 0x0f1115, fog: 0x0f1115, light: 0xffffff, intensity: 0.8 },
                light: { bg: 0xf8fafc, fog: 0xf8fafc, light: 0xffffff, intensity: 1.5 }
            }
        };

        let scene, camera, renderer, composer, bokehPass;
        let galleryGroup = new THREE.Group();
        let particles = [];
        let items = []; // Holds the groups containing front/back planes
        
        // Interactions
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredItem = null;
        let activeItem = null;
        let currentShape = 'sphere';
        let isFlipped = false;

        // Physics & Controls
        let isDragging = false;
        let previousMouse = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };
        let scrollTargetZ = 35; // Scroll storytelling depth
        
        // Idea 5: Dynamic Cursor Light
        let cursorLight;
        let invisiblePlane;

        // Video
        let videoTexture;

        init();
        animate();

        function init() {
            const canvas = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(config.colors.dark.bg);
            scene.fog = new THREE.FogExp2(config.colors.dark.fog, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = scrollTargetZ;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0; // FIXED BRIGHTNESS: Normalizes texture colors

            // Post Processing (Idea 1: Bokeh & Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.5; bloomPass.strength = 0.2; bloomPass.radius = 0.5;

            bokehPass = new BokehPass(scene, camera, {
                focus: config.globeRadius, // Focus on globe surface
                aperture: 0.0001,
                maxblur: 0.01,
                width: window.innerWidth, height: window.innerHeight
            });

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            composer.addPass(bokehPass);

            // Lighting
            const ambientLight = new THREE.AmbientLight(config.colors.dark.light, config.colors.dark.intensity);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 20);
            scene.add(dirLight);

            // Idea 5: Cursor Light
            cursorLight = new THREE.PointLight(0x38bdf8, 0, 20); // Starts at 0 intensity
            scene.add(cursorLight);
            invisiblePlane = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({visible: false}));
            scene.add(invisiblePlane);

            // Setup Video Texture (Idea 7)
            const video = document.getElementById('hidden-video');
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.colorSpace = THREE.SRGBColorSpace;

            createParticles();
            scene.add(galleryGroup);
            createGalleryItems();

            // Calculate layouts
            calculateSphereLayout();
            calculateHelixLayout();
            calculateGridLayout();
            
            // Initial transition
            transitionToShape('sphere');

            bindEvents();
            setupThemeToggle();
        }

        // --- Geometry Creation ---
        function createRoundedRect(w, h, r) {
            const shape = new THREE.Shape();
            const x = -w/2, y = -h/2;
            shape.moveTo(x, y + r); shape.lineTo(x, y + h - r); shape.quadraticCurveTo(x, y + h, x + r, y + h);
            shape.lineTo(x + w - r, y + h); shape.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
            shape.lineTo(x + w, y + r); shape.quadraticCurveTo(x + w, y, x + w - r, y);
            shape.lineTo(x + r, y); shape.quadraticCurveTo(x, y, x, y + r);
            const geo = new THREE.ShapeGeometry(shape);
            const pos = geo.attributes.position;
            const uvs = new Float32Array(pos.count * 2);
            for (let i = 0; i < pos.count; i++) { uvs[i*2] = (pos.getX(i)/w)+0.5; uvs[i*2+1] = (pos.getY(i)/h)+0.5; }
            geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            return geo;
        }

        // Idea 10: Backside Canvas Textures
        function createBacksideTexture(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 768;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#161920'; ctx.fillRect(0,0,512,768);
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 40px Arial';
            ctx.fillText(`Project ${index + 1}`, 50, 100);
            ctx.fillStyle = '#94a3b8'; ctx.font = '24px Arial';
            ctx.fillText('Role: Full Stack Developer', 50, 160);
            ctx.fillText('Tech: Three.js, Node, GSAP', 50, 200);
            ctx.fillStyle = '#f0f2f5'; ctx.font = '20px Arial';
            ctx.fillText('A detailed breakdown of the', 50, 280);
            ctx.fillText('architecture and problem-solving', 50, 310);
            ctx.fillText('process behind this application.', 50, 340);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createGalleryItems() {
            const texLoader = new THREE.TextureLoader();
            const geo = createRoundedRect(config.itemWidth, config.itemHeight, config.radius);

            for (let i = 0; i < config.numItems; i++) {
                const group = new THREE.Group(); // Holds front and back

                // Idea 7: Video Texture on item 0 and 5
                const isVideo = (i === 0 || i === 5);
                const frontTex = isVideo ? videoTexture : texLoader.load(`https://picsum.photos/seed/${i * 20}/400/600`);
                if(!isVideo) frontTex.colorSpace = THREE.SRGBColorSpace;

                // Idea 3: Base setup for Holographic Hover (Standard material allows emissive tinting)
                const frontMat = new THREE.MeshStandardMaterial({
                    map: frontTex, roughness: 0.2, metalness: 0.3,
                    emissive: new THREE.Color(0x000000), side: THREE.FrontSide
                });
                const frontMesh = new THREE.Mesh(geo, frontMat);
                
                const backMat = new THREE.MeshStandardMaterial({
                    map: createBacksideTexture(i), roughness: 0.5, side: THREE.FrontSide
                });
                const backMesh = new THREE.Mesh(geo, backMat);
                backMesh.rotation.y = Math.PI; // Flip back to face opposite

                group.add(frontMesh);
                group.add(backMesh);
                
                // Interaction hit box
                const hitBox = new THREE.Mesh(new THREE.BoxGeometry(config.itemWidth, config.itemHeight, 0.2), new THREE.MeshBasicMaterial({visible:false}));
                group.add(hitBox);

                group.userData = {
                    id: i, isVideo: isVideo,
                    layouts: { sphere: {}, helix: {}, grid: {} },
                    originalScale: new THREE.Vector3(1,1,1)
                };

                galleryGroup.add(group);
                items.push(group);
            }
        }

        // --- Idea 4: Shape Shifting Layouts ---
        function calculateSphereLayout() {
            const phi = Math.PI * (3 - Math.sqrt(5)); 
            items.forEach((item, i) => {
                const y = 1 - (i / (config.numItems - 1)) * 2; 
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = phi * i;
                const pos = new THREE.Vector3(Math.cos(theta) * radiusAtY, y, Math.sin(theta) * radiusAtY).multiplyScalar(config.globeRadius);
                
                const dummy = new THREE.Object3D();
                dummy.position.copy(pos);
                dummy.lookAt(pos.clone().multiplyScalar(2));
                
                item.userData.layouts.sphere = { position: pos, quaternion: dummy.quaternion.clone() };
            });
        }

        function calculateHelixLayout() {
            items.forEach((item, i) => {
                const y = - (config.numItems / 2) * 0.5 + (i * 0.5);
                const theta = i * 0.5;
                const pos = new THREE.Vector3(Math.cos(theta) * 8, y, Math.sin(theta) * 8);
                
                const dummy = new THREE.Object3D();
                dummy.position.copy(pos);
                dummy.lookAt(new THREE.Vector3(0, y, 0)); // Look at center column
                dummy.rotation.y += Math.PI; // Face outward

                item.userData.layouts.helix = { position: pos, quaternion: dummy.quaternion.clone() };
            });
        }

        function calculateGridLayout() {
            const cols = 6;
            const spacingX = config.itemWidth * 1.2;
            const spacingY = config.itemHeight * 1.2;
            items.forEach((item, i) => {
                const row = Math.floor(i / cols);
                const col = i % cols;
                const pos = new THREE.Vector3(
                    (col - cols/2 + 0.5) * spacingX,
                    -(row - (config.numItems/cols)/2 + 0.5) * spacingY,
                    0
                );
                
                const dummy = new THREE.Object3D(); // Flat rotation
                item.userData.layouts.grid = { position: pos, quaternion: dummy.quaternion.clone() };
            });
        }

        function transitionToShape(shapeName) {
            currentShape = shapeName;
            items.forEach((item, index) => {
                if(item === activeItem) return; // Don't animate the expanded item
                const target = item.userData.layouts[shapeName];
                gsap.to(item.position, { x: target.position.x, y: target.position.y, z: target.position.z, duration: 1.5, ease: "power3.inOut", delay: index * 0.01 });
                gsap.to(item.quaternion, { x: target.quaternion.x, y: target.quaternion.y, z: target.quaternion.z, w: target.quaternion.w, duration: 1.5, ease: "power3.inOut", delay: index * 0.01 });
            });
            
            // Reset rotation if moving to grid
            if(shapeName === 'grid') {
                gsap.to(targetRotation, {x:0, y:0, duration: 1.5});
            }
        }

        // --- Environment & Particles ---
        function createParticles() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(1000 * 3);
            for(let i=0; i<3000; i++) pos[i] = (Math.random() - 0.5) * 80;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            // Store original positions for Idea 9 (Repulsion)
            geo.setAttribute('originalPosition', new THREE.BufferAttribute(new Float32Array(pos), 3));

            const mat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.1, transparent: true, opacity: 0.4 });
            const p = new THREE.Points(geo, mat);
            scene.add(p);
            particles.push(p);
        }

        // --- Idea 6: Water Ripple Shockwave ---
        function triggerRipple(originObj) {
            const ringGeo = new THREE.RingGeometry(0.1, 0.2, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            
            // Match position and rotation to the card
            originObj.getWorldPosition(ring.position);
            originObj.getWorldQuaternion(ring.quaternion);
            scene.add(ring);

            gsap.to(ring.scale, { x: 30, y: 30, duration: 1, ease: "power2.out" });
            gsap.to(ringMat, { opacity: 0, duration: 1, ease: "power2.out", onComplete: () => scene.remove(ring) });
        }

        // --- Events & Interaction ---
        function bindEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
                bokehPass.uniforms['aspect'].value = camera.aspect;
            });
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', () => { isDragging = true; previousMouse = {x: event.clientX, y: event.clientY}; });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('click', onClick);
            
            // Idea 8: Scroll Storytelling (Zoom through the scene)
            window.addEventListener('wheel', (e) => {
                if(activeItem) return;
                scrollTargetZ += e.deltaY * 0.05;
                scrollTargetZ = Math.max(10, Math.min(scrollTargetZ, 60)); // Clamp depth
            });

            // UI Listeners
            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    transitionToShape(e.target.dataset.shape);
                });
            });

            document.getElementById('close-btn').addEventListener('click', closeExpandedView);
            document.getElementById('flip-btn').addEventListener('click', flipCard);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const dot = document.querySelector('[data-cursor-dot]');
            dot.style.left = `${event.clientX}px`; dot.style.top = `${event.clientY}px`;

            if (isDragging && !activeItem && currentShape !== 'grid') {
                targetRotation.y += (event.clientX - previousMouse.x) * 0.005;
                targetRotation.x += (event.clientY - previousMouse.y) * 0.005;
                targetRotation.x = Math.max(-0.5, Math.min(0.5, targetRotation.x));
                previousMouse = { x: event.clientX, y: event.clientY };
            }

            // Move invisible plane for light raycasting
            raycaster.setFromCamera(mouse, camera);
            const planeIntersect = raycaster.intersectObject(invisiblePlane);
            if(planeIntersect.length > 0 && !activeItem) {
                cursorLight.position.copy(planeIntersect[0].point);
                cursorLight.intensity = 2; // Turn on
            } else { cursorLight.intensity = 0; }

            handleHover();
        }

        function handleHover() {
            if (activeItem) return; 

            raycaster.setFromCamera(mouse, camera);
            // Intersect against hitboxes inside groups
            const hits = items.map(g => g.children[2]); 
            const intersects = raycaster.intersectObjects(hits);

            if (intersects.length > 0) {
                const group = intersects[0].object.parent;
                document.body.classList.add('hovering');

                if (hoveredItem !== group) {
                    if (hoveredItem) resetHover(hoveredItem);
                    hoveredItem = group;
                    
                    gsap.to(hoveredItem.scale, { x: config.hoverScale, y: config.hoverScale, z: config.hoverScale, duration: 0.3 });
                    
                    // Idea 3: Holographic Hover (Tint emissive map)
                    const frontMat = hoveredItem.children[0].material;
                    gsap.to(frontMat.emissive, { r: 0.1, g: 0.3, b: 0.5, duration: 0.3 });

                    // Idea 7: Play video if applicable
                    if(hoveredItem.userData.isVideo) document.getElementById('hidden-video').play();
                }
            } else {
                document.body.classList.remove('hovering');
                if (hoveredItem) {
                    resetHover(hoveredItem);
                    hoveredItem = null;
                }
            }
        }

        function resetHover(group) {
            gsap.to(group.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
            gsap.to(group.children[0].material.emissive, { r: 0, g: 0, b: 0, duration: 0.3 });
            if(group.userData.isVideo && group !== activeItem) document.getElementById('hidden-video').pause();
        }

        function onClick() {
            if (activeItem) return;
            if (!hoveredItem) return;

            activeItem = hoveredItem;
            document.body.classList.remove('hovering');
            triggerRipple(activeItem); // Idea 6: Ripple

            // UI
            document.getElementById('shape-controls').style.display = 'none';
            document.getElementById('action-overlay').classList.add('active');

            // Fade others
            items.forEach(p => { if (p !== activeItem) gsap.to(p.children[0].material, { opacity: 0.1, transparent: true, duration: 0.5 }); });
            
            // Animate Bokeh (Idea 1)
            gsap.to(bokehPass.uniforms['focus'], { value: camera.position.z - 5, duration: 1.2 });
            gsap.to(bokehPass.uniforms['aperture'], { value: 0.005, duration: 1.2 });

            // Calculate Target Position
            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
            const dist = Math.abs((config.itemHeight * 1.5) / (2 * Math.tan(camera.fov * Math.PI / 360)));
            const targetPos = new THREE.Vector3().copy(camera.position).add(camDir.multiplyScalar(dist));

            scene.attach(activeItem); 
            gsap.to(activeItem.position, { x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.2, ease: "power3.inOut" });
            gsap.to(activeItem.quaternion, { x: camera.quaternion.x, y: camera.quaternion.y, z: camera.quaternion.z, w: camera.quaternion.w, duration: 1.2, ease: "power3.inOut" });
            gsap.to(activeItem.scale, { x: 1.8, y: 1.8, z: 1.8, duration: 1.2, ease: "power3.inOut" });
        }

        // Idea 10: Flip Card
        function flipCard() {
            if(!activeItem) return;
            isFlipped = !isFlipped;
            const targetRotation = isFlipped ? Math.PI : 0;
            // Get local Y axis to rotate around, but since we matched camera quaternion, we just rotate around Y relative to camera
            gsap.to(activeItem.rotation, { y: activeItem.rotation.y + Math.PI, duration: 0.8, ease: "back.out(1.5)" });
        }

        function closeExpandedView() {
            if (!activeItem) return;

            document.getElementById('shape-controls').style.display = 'flex';
            document.getElementById('action-overlay').classList.remove('active');

            // If flipped, flip it back first visually
            if(isFlipped) { isFlipped = false; activeItem.rotation.y -= Math.PI; }

            const targetData = activeItem.userData.layouts[currentShape];
            
            // Dummy logic to find global position on the moving group
            const dummy = new THREE.Object3D();
            dummy.position.copy(targetData.position);
            dummy.quaternion.copy(targetData.quaternion);
            galleryGroup.add(dummy);
            
            const targetWorldPos = new THREE.Vector3(); const targetWorldQuat = new THREE.Quaternion();
            dummy.getWorldPosition(targetWorldPos); dummy.getWorldQuaternion(targetWorldQuat);
            galleryGroup.remove(dummy);

            gsap.to(activeItem.position, { x: targetWorldPos.x, y: targetWorldPos.y, z: targetWorldPos.z, duration: 1, ease: "power3.inOut" });
            gsap.to(activeItem.quaternion, { x: targetWorldQuat.x, y: targetWorldQuat.y, z: targetWorldQuat.z, w: targetWorldQuat.w, duration: 1, ease: "power3.inOut" });
            gsap.to(activeItem.scale, { x: 1, y: 1, z: 1, duration: 1, ease: "power3.inOut", onComplete: () => {
                galleryGroup.attach(activeItem); 
                activeItem = null;
                items.forEach(p => gsap.to(p.children[0].material, { opacity: 1, duration: 0.5 }));
                
                // Reset Bokeh
                gsap.to(bokehPass.uniforms['focus'], { value: config.globeRadius, duration: 1 });
                gsap.to(bokehPass.uniforms['aperture'], { value: 0.0001, duration: 1 });
                
                if(hoveredItem && hoveredItem.userData.isVideo) document.getElementById('hidden-video').pause();
            }});
        }

        function setupThemeToggle() {
            const btn = document.getElementById('theme-btn');
            btn.addEventListener('click', () => {
                const body = document.body;
                const isLight = body.getAttribute('data-theme') === 'light';
                const nextTheme = isLight ? 'dark' : 'light';
                
                body.setAttribute('data-theme', nextTheme);
                btn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                
                // Transition Three.js Environment
                const conf = config.colors[nextTheme];
                gsap.to(scene.background, { r: new THREE.Color(conf.bg).r, g: new THREE.Color(conf.bg).g, b: new THREE.Color(conf.bg).b, duration: 1 });
                gsap.to(scene.fog.color, { r: new THREE.Color(conf.fog).r, g: new THREE.Color(conf.fog).g, b: new THREE.Color(conf.fog).b, duration: 1 });
                gsap.to(scene.children[0], { intensity: conf.intensity, duration: 1 }); // Ambient Light
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            if (!isDragging && !activeItem && currentShape === 'sphere') targetRotation.y += 0.001; 

            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;

            galleryGroup.rotation.x = currentRotation.x;
            galleryGroup.rotation.y = currentRotation.y;
            if (!activeItem) galleryGroup.position.y = Math.sin(time * 0.5) * 0.3; // Idea 2: Audio/Rhythmic pulse mapping

            // Smooth Camera Scroll Mapping (Idea 8)
            camera.position.z += (scrollTargetZ - camera.position.z) * 0.05;

            // Idea 9: Interactive Particles (Repel from mouse vector mapped to world space)
            const pGeo = particles[0].geometry;
            const pPos = pGeo.attributes.position.array;
            const pOrig = pGeo.attributes.originalPosition.array;
            
            // Convert mouse to world position for repulsion
            const vec = new THREE.Vector3(mouse.x, mouse.y, 0.5);
            vec.unproject(camera);
            const dir = vec.sub(camera.position).normalize();
            const distance = (0 - camera.position.z) / dir.z; // Raycast to Z=0 plane
            const cursorWorld = camera.position.clone().add(dir.multiplyScalar(distance));

            for(let i=0; i<pPos.length; i+=3) {
                const px = pOrig[i], py = pOrig[i+1], pz = pOrig[i+2];
                // Simulating audio reactivity by pulsing the base positions slightly via sine
                const audioPulseX = px + Math.sin(time * 2 + py) * 0.2;
                const audioPulseY = py + Math.cos(time * 2 + px) * 0.2;

                const dx = audioPulseX - cursorWorld.x;
                const dy = audioPulseY - cursorWorld.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist < 5) {
                    const force = (5 - dist) / 5;
                    pPos[i] = audioPulseX + (dx/dist) * force * 2;
                    pPos[i+1] = audioPulseY + (dy/dist) * force * 2;
                } else {
                    pPos[i] += (audioPulseX - pPos[i]) * 0.1;
                    pPos[i+1] += (audioPulseY - pPos[i+1]) * 0.1;
                }
            }
            pGeo.attributes.position.needsUpdate = true;

            composer.render(); 
        }
    </script>
